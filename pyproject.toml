[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plr-gui"
version = "0.1.0"
description = "Local PyLabRobot GUI for simulation, run execution, reports, and resource authoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "platformdirs>=4.2",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]

[project.scripts]
plr-gui = "plr_gui.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.pytest.ini_options]
pythonpath = ["backend"]
